name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npx ng build

      # Claves de Google y Discogs: no estan en el repo, se crean desde los secretos del repositorio
      - name: API clients
        shell: bash
        run: |
          echo '${{ secrets.GOOGLE_CLIENT_JSON }}' > assets/google_client.json
          echo '${{ secrets.DISCOGS_CLIENT_JSON }}' > assets/discogs_client.json

      - name: Build app
        run: python -m PyInstaller --noconfirm Mulsa.spec

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer.iss

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/MulsaSetup-*.exe
